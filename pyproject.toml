[project]
name = "deepth-skill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xhyro-V", email = "naufalazharxyz12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
deepth-skill = "deepth_skill:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
